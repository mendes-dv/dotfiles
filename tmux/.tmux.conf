# ── General settings ───────────────────────────────────────────────────────── # Set a new keybinding to C-a {{{
unbind C-r
unbind C-b
set -g prefix C-a
bind C-a send-prefix
# }}}

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -sg escape-time 0 # change the escape time in tmux to zero, improves vim responsiveness

setw -g mode-keys vi
bind -n M-y copy-mode
bind v copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# set -g default-shell /bin/sh
# set -g default-shell /usr/local/bin/bash
set -g default-command ${SHELL}
if-shell "type 'reattach-to-user-namespace' >/dev/null" "set -g default-command 'reattach-to-user-namespace -l $SHELL'"
# set -g default-command ${SHELL}

# Enable true (24bit) colors for version >= 2.2
# See https://deductivelabs.com/en/2016/03/using-true-color-vim-tmux/
# https://medium.com/@dubistkomisch/how-to-actually-get-italics-and-true-colour-to-work-in-iterm-tmux-vim-9ebe55ebc2be
# set -ga terminal-overrides ',tmux-256color-italic:Tc:sitm=\E[3m'
set -g xterm-keys on
set -as terminal-overrides ',xterm*:Tc:sitm=\E[3m'

set -g base-index 1 # start with window 1 (instead of 0)
set -g pane-base-index 1 # start with pane 1
setw -g mode-keys vi # enable vim mode
setw -g mouse on

# visual notification of activity in other windows {{{
#setw -g monitor-activity on
#set -g visual-activity on
# }}}

# # reload tmux.conf {{{
# unbind r
# bind r source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'
# # }}}

# Tmux resurrect / continuum {{{
set -g @resurrect-strategy-nvim 'session' # restore neovim session if Session.vim file is present
set -g @continuum-save-interval '5' # save every 5 minutes
set -g @continuum-restore 'on' # auto restore on boot
# }}}

# ── Kill / create actions ────────────────────────────────────────────────────────
bind -n M-x kill-pane
bind -n M-X kill-window
bind -n M-c new-window
bind -n M-, command-prompt -I "#W" "rename-window '%%'"
bind -n M-$ command-prompt -I "#S" "rename-session '%%'"

# ── Splits ───────────────────────────────────────────────────────────────────────
# FIXED: Changed M-n to M-N to avoid conflicts
# bind -n M-n split-window -h -c "#{pane_current_path}"
# bind -n M-v split-window -v -c "#{pane_current_path}"

# Alternative: use prefix-based splits if Alt doesn't work
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ── Pane settings ───────────────────────────────────────────────────────────────
# Vim style pane selection (prefix + hjkl)
# bind-key h select-pane -L
# bind-key j select-pane -D
# bind-key k select-pane -U
# bind-key l select-pane -R

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left previous-window
bind -n S-Right next-window

bind-key X kill-pane

# move panes (cycle) left and right {{{
# bind-key -r "<" swap-window -t -1
# bind-key -r ">" swap-window -t +1
# }}}

bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

# Pane resizing {{{
# bind-key -r H resize-pane -L "5"
# bind-key -r L resize-pane -R "5"
# bind-key -r J resize-pane -D "5"
# bind-key -r K resize-pane -U "5"
# }}}

# create session
bind C-C new-session

bind -r D neww -c "#{pane_current_path}" "[[ -e TODO.md ]] && nvim TODO.md || nvim ~/notes/todo.md"

# Spotify Player popup (prefix + C-p) — requires `spotify_player` CLI on PATH
bind C-p run-shell '
if ! command -v spotify_player >/dev/null 2>&1; then
  tmux display-message "spotify_player not installed - run: brew install spotify_player"
  exit 0
fi
if [ "#{session_name}" = "spotify" ]; then
  tmux display-message "Already in spotify session - use prefix d to detach"
else
  tmux has-session -t spotify 2>/dev/null || tmux new-session -d -s spotify spotify_player
  tmux display-popup -E "tmux attach -t spotify"
fi'

bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind-key -r 7 run-shell "~/.local/bin/tmux-sessionizer ~/work/Scripts"
bind-key -r 6 run-shell "~/.local/bin/tmux-sessionizer ~/work/Internal"

# Tmux plugins {{{
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @plugin "tmux-plugins/tmux-yank"
set -g @plugin "tmux-plugins/tmux-copycat"
set -g @plugin "tmux-plugins/tmux-open"
set -g @plugin "tmux-plugins/tmux-pain-control"
set -g @plugin "christoomey/vim-tmux-navigator"
set -g @plugin "tmux-plugins/tmux-sessionist"
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'erikw/tmux-powerline'

set -s default-terminal 'tmux-256color'

# Check if tmux plugin manager is installed, otherwise clone it.
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Bindings that must override plugin defaults (loaded after TPM)
# Fuzzy session switcher — pain-control would otherwise re-bind C-j to select-pane -D
bind C-j display-popup -E -w 50% -h 40% "~/.local/bin/tmux-session-switcher"

# Lazygit popup (prefix + g)
bind -r g display-popup -d '#{pane_current_path}' -w 80% -h 80% -E lazygit

# Per-project Claude Code popup (prefix + C-i)
# Each pane_current_path gets its own persistent claude session, attached in a floating window.
bind C-i run-shell '\
  SESSION="claude-$(echo "#{pane_current_path}" | shasum | cut -c1-8)"; \
  tmux has-session -t "$SESSION" 2>/dev/null || \
    tmux new-session -d -s "$SESSION" -c "#{pane_current_path}" "claude"; \
  tmux display-popup -E -w 90% -h 90% "tmux attach -t $SESSION"'

# Sync status bar colors with macOS appearance at startup.
# Manual refresh: prefix + T (after toggling macOS appearance).
run-shell '~/.local/bin/tmux-theme-sync'
bind T run-shell '~/.local/bin/tmux-theme-sync' \; display 'tmux theme synced'
# }}}


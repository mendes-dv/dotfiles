# ── General settings ──────────────────────────────────────────────────────────
# Set a new keybinding to C-s (matching Zellij's pane mode) {{{
  unbind C-b
  set -g prefix C-s
  bind C-s send-prefix
# }}}

# Set a new keybinding for C-l {{{
  bind C-l send-keys 'C-l'
# }}}

# ── Zellij-like keybindings ──────────────────────────────────────────────────
# Pane mode (C-s - already the prefix) {{{
  # Pane navigation (hjkl and arrow keys)
  bind h select-pane -L
  bind j select-pane -D
  bind k select-pane -U
  bind l select-pane -R
  bind Left select-pane -L
  bind Down select-pane -D
  bind Up select-pane -U
  bind Right select-pane -R
  
  # Pane splitting
  bind v split-window -h -c "#{pane_current_path}"  # vertical split (like Zellij)
  bind s split-window -v -c "#{pane_current_path}"  # horizontal split (like Zellij)
  bind n new-window -c "#{pane_current_path}"       # new pane/window
  
  # Close pane
  bind x kill-pane
  
  # Toggle fullscreen
  bind f resize-pane -Z
  
  # Previous pane
  bind p last-pane
# }}}

# Tab/Window mode (C-t) {{{
  bind -n C-t switch-client -T window_mode
  bind -T window_mode h previous-window
  bind -T window_mode j previous-window
  bind -T window_mode k next-window
  bind -T window_mode l next-window
  bind -T window_mode Left previous-window
  bind -T window_mode Down previous-window
  bind -T window_mode Up next-window
  bind -T window_mode Right next-window
  bind -T window_mode n new-window -c "#{pane_current_path}"
  bind -T window_mode c command-prompt "rename-window '%%'"
  bind -T window_mode x kill-window
  bind -T window_mode 1 select-window -t 1
  bind -T window_mode 2 select-window -t 2
  bind -T window_mode 3 select-window -t 3
  bind -T window_mode 4 select-window -t 4
  bind -T window_mode 5 select-window -t 5
  bind -T window_mode 6 select-window -t 6
  bind -T window_mode 7 select-window -t 7
  bind -T window_mode 8 select-window -t 8
  bind -T window_mode 9 select-window -t 9
  bind -T window_mode Tab last-window
# }}}

# Session mode (C-q) {{{
  bind -n C-q switch-client -T session_mode
  bind -T session_mode d detach-client
  bind -T session_mode n new-session
  bind -T session_mode q confirm-before -p "kill-session #S? (y/n)" kill-session
# }}}

# Scroll/Copy mode (C-b) {{{
  bind -n C-b copy-mode
# }}}

# Resize mode (C-r) {{{
  bind -n C-r switch-client -T resize_mode
  bind -T resize_mode h resize-pane -L 5
  bind -T resize_mode j resize-pane -D 5
  bind -T resize_mode k resize-pane -U 5
  bind -T resize_mode l resize-pane -R 5
  bind -T resize_mode Left resize-pane -L 5
  bind -T resize_mode Down resize-pane -D 5
  bind -T resize_mode Up resize-pane -U 5
  bind -T resize_mode Right resize-pane -R 5
  bind -T resize_mode z resize-pane -Z
# }}}

set-option -sg escape-time 0 # change the escape time in tmux to zero, improves vim responsiveness
set-option -g history-limit 50000 # Increase scrollback history

# set -g default-shell /bin/sh
# set -g default-shell /usr/local/bin/bash

set -g default-command ${SHELL}
if-shell "type 'reattach-to-user-namespace' >/dev/null" "set -g default-command 'reattach-to-user-namespace -l $SHELL'"
# set -g default-command ${SHELL}

# Enable true (24bit) colors for version >= 2.2
# See https://deductivelabs.com/en/2016/03/using-true-color-vim-tmux/
# https://medium.com/@dubistkomisch/how-to-actually-get-italics-and-true-colour-to-work-in-iterm-tmux-vim-9ebe55ebc2be
# set -ga terminal-overrides ',tmux-256color-italic:Tc:sitm=\E[3m'
set -as terminal-overrides ',xterm*:Tc:sitm=\E[3m'
set -g base-index 1 # start with window 1 (instead of 0)
set -g pane-base-index 1 # start with pane 1
setw -g mode-keys vi # enable vim mode
setw -g mouse on
 
# vi-copy settings (<prefix> v) {{{
  unbind v
  bind v copy-mode
  bind-key -Tcopy-mode-vi 'v' send -X begin-selection
  bind-key -Tcopy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"
  bind-key -Tcopy-mode-vi Escape send -X cancel
  bind-key -Tcopy-mode-vi V send -X rectangle-toggle
# }}}

# visual notification of activity in other windows {{{
  #setw -g monitor-activity on
  #set -g visual-activity on
# }}}

# reload tmux.conf {{{
  unbind r
  bind r source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'
# }}}

# Tmux resurrect / continuum {{{
  set -g @resurrect-strategy-nvim 'session' # restore neovim session if Session.vim file is present
  set -g @continuum-save-interval '5' # save every 5 minutes
  set -g @continuum-restore 'on' # auto restore on boot
# }}}

# ── Pane settings ───────────────────────────────────────────────────────────

# Pane resizing {{{
  bind-key -r H resize-pane -L "5"
  bind-key -r L resize-pane -R "5"
  bind-key -r J resize-pane -D "5"
  bind-key -r K resize-pane -U "5"
# }}}

# switch between previous and next pane {{{
  bind-key C-n next-window
  bind-key C-p previous-window
# }}}

# move panes (cycle) left and right {{{
  bind-key -r "<" swap-window -t -1
  bind-key -r ">" swap-window -t +1
# }}}

set-option remain-on-exit on # keep new-window 'terminal command' open after the command exits 0
# create session
bind C-C new-session
bind -r D neww -c "#{pane_current_path}" "[[ -e TODO.md ]] && nvim TODO.md || nvim ~/notes/todo.md"
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind-key -r 7 run-shell "~/.local/bin/tmux-sessionizer ~/work/Scripts"
bind-key -r 6 run-shell "~/.local/bin/tmux-sessionizer ~/work/Internal"

# Tmux plugins {{{
  set -g @plugin "tmux-plugins/tpm"
  set -g @plugin "tmux-plugins/tmux-continuum"
  set -g @plugin "tmux-plugins/tmux-yank"
  set -g @plugin "tmux-plugins/tmux-copycat"
  set -g @plugin "tmux-plugins/tmux-open"
  set -g @plugin "tmux-plugins/tmux-pain-control"
  set -g @plugin "christoomey/vim-tmux-navigator"
  set -g @plugin "tmux-plugins/tmux-sessionist"
  set -g @plugin 'tmux-plugins/tmux-sensible'
  set -g @plugin 'dracula/tmux'
  set -s default-terminal 'tmux-256color'

# dracula customizations
  set -g @dracula-plugins "git time"
  set -g @dracula-show-powerline true
  set -g @dracula-military-time true

  # run "~/Development/open-source/tmux-nerd-status/tmux_nerd_status.tmux"
  # Check if tmux plugin manager is installed, otherwise clone it.
  if "test ! -d ~/.tmux/plugins/tpm" \
     "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

  # Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
  run '~/.tmux/plugins/tpm/tpm'
# }}}

